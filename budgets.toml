#  budgets.toml -- the SINGLE SOURCE OF TRUTH for every line budget.
#
#  Read by tools/loc.py, which is the enforcing authority and runs in CI. No other file may
#  restate a number from this table -- not docs/HLD.md, not CLAUDE.md, not the README. That rule
#  is enforced by `test_no_doc_restates_a_cap_number` for caps of 100 or more; a two-digit cap
#  cannot be told from an ordinary number by a textual guard, and the gap is recorded in that test.
#
#  ==========================================================================================
#  SPRINT RE-BASELINE, 2026-10-12. ONE re-freeze, with the glue priced.
#  ==========================================================================================
#
#  ROOT CAUSE. Four sprint blocks in a row hit a component that had no line item anywhere:
#
#    B0  the second milestone's core modules -- priced as a single 170-line lump deliberately
#        placed OUTSIDE the cap, and `narrate.py` not priced at all, though HLD section 2 has
#        named it as scope since v1.
#    S1  `app/data.py` (then `loader.py`) -- named in HLD section 4.1, priced at ten lines for
#        "policy load", and its budget pattern did not even match the file.
#    S2  the section 7 pipeline ordering -- a named CORRECTNESS requirement with its own test,
#        belonging to no module row in section 4.1 and to no line item here.
#    S3  the data-validation, rendering and clause-id layers -- all three sit between core and
#        the adapters, all three were priced at zero.
#
#  The pattern is one thing, not four. **Every estimate was built by listing the NAMED MODULES in
#  HLD section 4.1 and costing those.** Anything that lives BETWEEN named modules -- loading,
#  validating, ordering, rendering, naming, wiring, persisting -- was costed at nothing, because
#  the method never looked for it. The modules themselves were estimated well: `tutor.py` came in
#  at 96 against 95, `main.py` and `schemas.py` are projected UNDER their original figures. The
#  method was wrong about glue, and glue is roughly a third of the system.
#
#  THE FIX, and the reason this is a re-baseline rather than a fifth exceedance: every bucket
#  below is re-derived bottom-up over EVERYTHING still to build in S4-S11, and each one lists its
#  GLUE items explicitly alongside its named modules. Ceiling = cap + 10%, as before.
#
#  **After this, no budget stops the sprint unless a bucket crosses its re-baselined ceiling.**
#  The caps are not raised again, and no bucket is added (team conditions, 2026-10-12).
#
#  This re-baseline RECORDS TWO ONE-TIME CEILING RAISES, called what they are rather than
#  presented as a re-derivation:
#    * `core` -- measured 842 against a frozen 886 ceiling. See HLD section 16 (S2).
#    * `api_cli` -- measured 457 against a frozen 380 ceiling, projected 648. See HLD section 16.
#  Both were taken to keep full scope (M1 + M2) for the progress review.
#
#  ==========================================================================================
#  DERIVATION -- measured actuals, then every remaining item, glue included
#  ==========================================================================================
#
#  core -- backend/src/core/*.py, excluding session.py and the M2 modules
#    MEASURED 2026-10-12:  english 200 · facts 130 · tutor 96 · search 93 · cnf 72 · logic 65
#                          models 61 · entail 42 · relevance 30 · bkt 39 · config 9     = 842
#    REMAINING:  TRANSLATE transition row + dispatch in tutor.py (M2 wiring)             = 12
#    => 854 · ceiling 940
#
#  core_session -- backend/src/core/session.py
#    The section 7 pipeline and the ONLY writer of a `State` (v2.11; enforced by
#    `test_only_session_writes_a_state`).
#    MEASURED 2026-10-12, after the layering fix moved presentation out (no `_STATUS` table, no
#    `schema_version`; `State.entailment` holds the `Entailment` dataclass and its enum):
#      analyse 48 · state_of 42 · change_merges 13 · Analysis 9 · record_clause 9 · _one 5
#      · enter_stage 4 · record_hint 2 · imports 8 · ResetRequired 1                     = 142
#    REMAINING: the M2 translate record                                                  = 6
#    => 148 · ceiling 163
#
#    ROOT CAUSE of the estimate that missed (22 against an actual 42 for `state_of`): it priced
#    the IDEA of the function, not the lines the language requires. `State` has 16 fields, so the
#    constructor is 16 lines; the keyword-only signature is 8 parameters; the clause loop is 13.
#    That is 37 mechanical lines before any logic at all. This was the fifth budget stop of the
#    sprint and the reason the caps became REPORTED rather than blocking -- see the sprint rule
#    in CLAUDE.md and HLD section 16.
#
#  core_m2 -- translation.py, formula.py, narrate.py (B0 derivation, unchanged)
#    translation 110 · formula 90 · narrate 45                                           = 245
#    => 245 · ceiling 270
#
#  api_cli -- the shared edge, the two adapters and the API schemas
#    MEASURED 2026-10-12:  app/data 177 · cli 171 · app/render 49 · app/view 32
#                          app/__init__ 28                                              = 457
#    REMAINING -- api/schemas.py, using pydantic TypeAdapter on the CORE dataclasses so the
#    `State` field list is declared once (the v2.10 decision that keeps State in core costs a
#    second declaration; TypeAdapter removes it):
#      TypeAdapter(State) + the canonicalisation wrapper (sorted lists for sets)          10
#      the `action` discriminated union: step / hint / claim_not_provable / translate      22
#      request envelopes: next / parse / act                                              13
#      response envelopes: next / parse / act                                             19
#      State <-> core conversion, both directions                                         18
#                                                                                       = 82
#    REMAINING -- api/main.py:
#      app + CORS (localhost and 127.0.0.1:5173) + startup Runtime.load()                 14
#      GET /api/health 3 · POST /api/next 12 · POST /api/parse 16 · POST /api/act 26      57
#      error mapping: ParseError/TransitionError/ResetRequired/DataError -> 400/404/409    20
#                                                                                       = 91
#    REMAINING -- GLUE, the category this re-baseline exists to price:
#      app/view.py  Board.from_state(), so the API can rebuild a board from a stored State  8
#      app/render.py  the M2 translate diagnosis + counterexample rendering                10
#                                                                                       = 18
#    => 648 · ceiling 713
#
#  scripts -- scripts/*.py, EVALUATION tooling only
#    MEASURED 2026-10-12:  difficulty.py                                                 = 50
#    REMAINING -- run_experiments.py:
#      arguments, commit stamp, output paths                                              15
#      the simulation: synthetic student, 3 arms, seeded, N runs                           35
#      the bar chart (3 bars, one baseline, the caveat in the caption)                     18
#      the search-cost table 14 · the hint-soundness table 16                              30
#      the translation differential statistics                                             14
#      the markdown writer                                                                 12
#                                                                                       = 124
#    REMAINING -- heldout_eval.py 45 · analyze_pilot.py 35                                = 80
#    REMAINING -- GLUE: scripts/report.py, the commit-stamp + markdown-table helper all four
#      scripts need. Priced because "every number in the docs is stamped with a commit" is a
#      CLAUDE.md rule, and four copies of the stamping code is how three of them drift.      30
#    => 284 · ceiling 313
#
#  frontend -- frontend/src/**
#    Nothing built, so this is estimate only and UNCALIBRATED. The glue items are listed first
#    because they are the ones the old 665 figure left out entirely.
#    GLUE:
#      api.js       fetch wrapper, error-code mapping, base URL from env                   45
#      storage.js   localStorage in try/catch, schema_version guard, discard on mismatch   35
#      useSession.js the state hook: current State, pending, error, action dispatch        55
#      main.jsx 12 · vite.config.js + env 10                                               22
#    COMPONENTS:
#      ReadFacts.jsx  sentences with per-sentence errors, facts table, merge/split by
#                     phrase id, the v2.7 A4 downstream-reset confirmation                120
#      ProveBoard.jsx clause cards, selection, resolvent input, the [] button, hints 1-3,
#                     "Does not follow"                                                  135
#      App.jsx        stage routing Read&Facts -> Translate -> Prove -> Explanation        70
#      Explanation.jsx the narrative plus the clause trace                                 40
#      Feedback.jsx 30 · MasteryBars.jsx 30                                                60
#      TranslateStep.jsx (M2) typed input, insert buttons, per-sentence counterexample     85
#      index.css                                                                          120
#    => 787 · ceiling 866
#
#  tools -- tools/*.py, DEVELOPMENT tooling, REPORTED BUT NOT CAPPED
#    loc.py and mutate.py never run in the shipped product and add nothing to runtime
#    complexity or the viva surface. Capping them penalised exactly the work that makes the
#    other caps trustworthy.

schema = 1
frozen = "2026-10-12"

[core]
patterns = ["backend/src/core/*.py"]
exclude = [
    "backend/src/core/session.py",
    "backend/src/core/translation.py",
    "backend/src/core/formula.py",
    "backend/src/core/narrate.py",
]
cap = 854
ceiling = 940

[core_session]
label = "core (session)"
patterns = ["backend/src/core/session.py"]
cap = 148
ceiling = 163

[core_m2]
label = "core (M2)"
patterns = [
    "backend/src/core/translation.py",
    "backend/src/core/formula.py",
    "backend/src/core/narrate.py",
]
cap = 245
ceiling = 270

[api_cli]
label = "api + cli"
# Everything outside core: the shared edge (`app/`), the two thin adapters (`cli.py`,
# `api/main.py`) and the API schemas. The pattern used to name `cli.py` alone, so `loader.py` --
# which v2.4 placed in this bucket -- was unmeasured; found by the sprint's F3 fix, and
# `test_every_source_file_is_measured_by_exactly_one_bucket` now catches the next one.
patterns = ["backend/src/api/*.py", "backend/src/app/*.py", "backend/src/*.py"]
cap = 648
ceiling = 713

[scripts]
patterns = ["scripts/*.py"]
cap = 284
ceiling = 313

[frontend]
patterns = ["frontend/src/**/*.js", "frontend/src/**/*.jsx", "frontend/src/**/*.css"]
cap = 787
ceiling = 866

[tools]
patterns = ["tools/*.py"]
capped = false

# Reported sums, so splitting a bucket can never hide a total (team condition, 2026-10-12).
# `core` is three buckets for sound design reasons, and three small caps are easy to read as
# three small costs. The CORE TOTAL row prints the whole tree against the sum of its caps.
[totals]
"CORE TOTAL" = ["core", "core_session", "core_m2"]

# Functions allowed to exceed the length gate, each with a one-line reason. Printed by
# `tools/loc.py` on every run, so an exemption is visible in the CI log rather than buried here.
# EMPTY at the time the gate was switched on: the longest function in the repo was 48 lines, and
# the two complexity breaches were fixed by extraction rather than excused.
[long_functions]
