# Every piece of user-facing text, in one place (docs/HLD.md section 4.1).
#
# It is DATA for the same reason the evidence table is: there is no decision in it. The CLI and the
# API both render these strings, so a template in either edge would be a template the other one
# disagrees with -- and wording a student reads is exactly the thing that should be reviewable in
# one file rather than hunted through two code paths.
#
# It carries no logic. Which message to show is decided by `core` (a `logic.Code`, a `Hint.code`,
# an `ErrorCode`); this file only says how to say it. `test_messages.py` asserts that every code
# the system can produce has an entry, derived from the enums rather than from this file, so a new
# code cannot be added without wording.
#
# `{placeholders}` are filled by the edge. The names are part of the contract and are checked.

schema_version: 1

# --------------------------------------------------------- resolution step diagnosis (section 6.7)
# One per logic.Code. Each names the mistake rather than reporting "wrong": naming it is the whole
# formative premise of the project, and "incorrect" teaches nothing.
step:
  NO_CLASH: "those two clauses share no complementary literal, so they cannot be resolved."
  DOUBLE_CANCEL: "only ONE complementary pair may be cancelled per step; you cancelled several."
  WRONG_RESOLVENT: "missing {missing}, extra {extra}."
  TAUTOLOGY: "that clause is always true, so it can never help a refutation."
  DUPLICATE: "that clause is already on the board."
  VALID: "valid."

# ---------------------------------------------------- FOL resolution step diagnosis (HLD S18.16.2)
# Same discipline as `step:` above: name the mistake, never "wrong". {clause_a}/{clause_b} are the
# two clauses the student picked, pre-rendered with their board label (e.g. "F1: Student(x)");
# {typed} is the student's own answer, rendered back so they read it next to the explanation
# rather than having to remember what they typed. NOT_COMPLEMENTARY and WRONG_RESOLVENT are the
# two a genuinely-trying student hits most, so both restate the resolution rule itself, not just
# name the mistake -- a student needs enough to try again, not just to be told it was wrong.
fol_step:
  VALID: "valid."
  FOL_STEP_NOT_COMPLEMENTARY: >
    {clause_a} and {clause_b} share no predicate that is positive in one and negated in the
    other -- there is nothing between them for resolution to cancel. Resolution needs the SAME
    predicate name and the same number of arguments, once positive and once negated, one in each
    clause you pick.
  FOL_STEP_NO_UNIFIER: >
    {clause_a} and {clause_b} do have a predicate that is positive in one and negated in the
    other, but their arguments cannot be made equal -- two different individuals, for instance,
    can never be unified with each other. Look at exactly what each literal's arguments are; a
    shared predicate name is not enough on its own.
  FOL_STEP_DOUBLE_RESOLVE: >
    that cancels two complementary pairs at once. Resolution removes exactly ONE pair per step --
    pick one pair now and write that resolvent; the other pair is still there to resolve on a
    later step.
  FOL_STEP_SUBST_INCOMPLETE: >
    part of {clause_a} or {clause_b} still shows a variable where the substitution from this step
    should have replaced it. Once a variable is bound to resolve one pair of literals, that SAME
    binding has to be applied to every other literal that survives -- not only the ones that were
    cancelled.
  FOL_STEP_WRONG_RESOLVENT: >
    {typed} is not what resolving {clause_a} with {clause_b} produces. Re-check which literal
    pair you are resolving on, and what is left over from each clause once that pair is removed
    and the substitution is applied to it.

# ----------------------------------------- a typed FOL answer that is not formal notation at all
# A syntax refusal, same family as `error:`'s UNPARSEABLE -- "I" because the SYSTEM is the one
# that could not read it, mirroring that block's voice exactly. {text} is the exact string the
# student typed, quoted verbatim, so a typo is visibly a typo and not a mystery.
fol_answer:
  FOL_ANSWER_MALFORMED: >
    I couldn't read "{text}" as a formula. A literal looks like Pred(term, term) -- or just Pred
    with no arguments -- optionally preceded by ¬ or ~, with clauses joined by ∨. Check for a
    missing parenthesis, a stray symbol, or a predicate name that doesn't start with a letter.

# How a valid step is described, by whether it shortened the proof. `unknown` is the work-budget
# case: the search ran out, so productivity is genuinely undecided and must not be guessed.
productivity:
  productive: "That shortens the proof."
  unproductive: "Legal, but no closer to a refutation."
  unknown: "Legal. (the search ran out of its budget, so I cannot say if it helps.)"

# ------------------------------------------------------------------------ hints (sections 6.6, 6.6.1)
# The proof ladder reveals one parent, then both, then the resolvent. The wording must not reveal
# more than the level does -- and it cannot, because the Hint object carries only that much.
hint:
  HINT_1: "start from {clauses}."
  HINT_2: "resolve {clauses}."
  HINT_3: "resolve {clauses} to get {resolvent}."
  HINT_FALLBACK: "try resolving {clauses} to get {resolvent} -- a suggestion, not necessarily the best step."
  HINT_UNAVAILABLE: "there is nothing left to resolve."
  # Levels 1 and 2 give the METHOD, not the verdict, so a student who follows L2 reaches the
  # answer themselves. L3 gives it away deliberately, priced by the BKT hint rule (section 9).
  HINT_NOT_FOLLOW_1: "before proving, check whether the conclusion really follows."
  HINT_NOT_FOLLOW_2: "look for a situation where every premise is true and the conclusion is false."
  HINT_NOT_FOLLOW_3: "it does not follow. Say so."
  # Outcome-level FOL hints (HLD S18.7's Facts-panel fix, follow-up 2026-11-01). These were
  # written when there was no exposed proof trace to walk toward -- that changed at S18.14/15,
  # and S18.16.9 adds STEP-level hints below that walk it. These three stay as the fallback: the
  # verdict-only message shown when a step hint genuinely does not apply (budget exhausted, or
  # the student's own valid path has moved past what the canonical derivation can address).
  HINT_FOL_FOLLOWS_1: "this argument is valid under first-order logic -- check your assumption that it doesn't follow."
  HINT_FOL_FOLLOWS_2: "the first-order engine proved the premises entail the conclusion."
  HINT_FOL_FOLLOWS_3: "it follows. Reconsider a \"does not follow\" claim."
  HINT_FOL_UNKNOWN: "the search budget ran out before a proof was found. The system genuinely does not know whether this follows, so this hint is not scored either way."
  # Step-level FOL hints (HLD S18.16.9). Which step is hinted is picked by how many clauses the
  # STUDENT has already derived, not by `level` -- asking twice without deriving anything
  # re-describes the same step in more detail; deriving one advances to the next automatically.
  # {clause_a}/{clause_b} are pre-labeled text, matching fol_step's own wording exactly
  # ("F1: ..."); {unifier} is pre-formatted ("where x = ravi" or "no substitution needed").
  HINT_FOL_STEP_1: "resolve {clause_a} with {clause_b}."
  HINT_FOL_STEP_2: "resolve {clause_a} with {clause_b}, {unifier}."
  # The honest fallback for a genuinely different case than budget-exhausted: a real derivation
  # exists, but its next step needs a clause the student's own (still valid) path has not
  # produced. Never invents a hint for a path it was not computed for (never-guess, principle 2).
  HINT_FOL_STEP_UNAVAILABLE: >
    the worked proof's next step uses a clause your own path has not produced -- you have taken
    a different, still-valid route. Keep resolving from what is on your board; there is no hint
    for this specific path.

# ----------------------------------------------------------------------- claims (sections 8, 9)
claim:
  CLAIM_ACCEPTED: "correct -- it does not follow."
  CLAIM_REJECTED: "it does follow; keep going."

# -------------------------------------------------------- leaving the Facts screen (section 14)
# Not scored (section 9): the student is agreeing with what is on screen, which is not an answer.
confirm:
  FACTS_CONFIRMED: "facts confirmed. Now prove the conclusion."
  MERGE_RESET: "facts changed. Your proof on the old symbols was discarded -- check the facts again."

# ------------------------------------------------------- refusals (section 3.4, never a guess)
# Every one carries a rephrasing hint. A refusal without one tells the student they are wrong
# without telling them what to do, which is the failure mode "never guess" is meant to avoid.
error:
  UNPARSEABLE: "I cannot read that sentence. Try one of the supported patterns, e.g. \"If A then B.\""
  AMBIGUOUS_AND_OR: "mixing \"and\" with \"or\" in one sentence is ambiguous. Split it into two sentences."
  QUANTIFIER_UNSUPPORTED: "words like \"all\", \"every\" and \"some\" are beyond this system. Rewrite about one specific case."
  TOO_LONG: "that sentence is too long. Split it into shorter ones."
  EMPTY_FACT_PHRASE: "one side of that connective has no content. Write a full statement on both sides."
  TOO_MANY_SENTENCES: "too many sentences. Shorten the paragraph."
  TOO_MANY_FACTS: "too many distinct facts to reason about. Merge the ones that mean the same thing, or shorten the paragraph."
  SUSPICIOUS_FRAGMENT: "\"{sentence}\" looks like a fragment, probably from an abbreviation. Spell it out."
  UNKNOWN_PHRASE: "I do not know the phrase \"{sentence}\"."
  SELF_MERGE: "a phrase cannot be merged with itself."
  CONFLICTING_MERGE: "those two phrases already have a different relation. Undo it first."
  RELEVANCE_REQUIRES_CONSISTENCY: "the premises contradict each other, so nothing follows from them."

# ------------------------------------------------------------------ entailment (section 6.4)
entailment:
  ENTAILED: "the conclusion does follow from these premises. Now prove it."
  NOT_ENTAILED: "the truth table says this conclusion does NOT follow -- but you have to decide that."
  INCONSISTENT_PREMISES: "these premises contradict each other, so anything at all follows. The exercise stops here."
  counterexample: "a situation where every premise holds and the conclusion fails: {row}"

# ----------------------------------------------------------------------- warnings (not errors)
warning:
  # {phrase} is the detail core puts after the code. Naming the phrase is the whole value of this
  # warning -- "something" would leave the student hunting. The startup check found this: the
  # renderer supplied the placeholder and no template used it.
  CONCLUSION_FACT_UNSEEN: "the conclusion mentions {phrase}, which no premise does. Usually a typo -- but it is also what a \"does not follow\" exercise looks like."
  TAUTOLOGICAL_CONCLUSION: "that conclusion is true in every situation, so it follows from any premises at all."

# ------------------------------------------------- the command-line adapter's own chrome
# `cli.py` is an I/O adapter and holds NO wording: it reads a line, calls `app`, prints. Every
# sentence it shows is here, so a reviewer can read everything a student sees in one file and
# `test_adapters_hold_no_user_facing_wording` can fail the build if any of it creeps back.
cli:
  banner: "ProofPilot. Type `help` for commands, `quit` to leave."
  help: "{commands}"
  commands: |
    yes | confirm           confirm the facts shown above and start proving
    merge <a> <b> <rel>     same | opposite | different, e.g. `merge p1 p2 same`
    <a> <b> = <literals>   resolve a with b, e.g. `c1 c2 = B`; `=` alone derives []
    hint                   ask for a hint; repeating escalates 1 -> 2 -> 3
    no                     claim the conclusion does not follow
    facts                  show the facts and the board again
    skip                   give up on this exercise and move on
    quit                   leave
  prompt: "> "
  paragraph: "paragraph: "
  conclusion: "conclusion: "
  header: "[{exercise} / {topic} / {band}]"
  facts: "facts:"
  board: "board:"
  mastery: "mastery:  "
  not_needed: "not needed for this conclusion"
  unplayable: "some sentences were refused, so this exercise cannot be played."
  say_no: "say `no` when you are sure."
  solved: "EMPTY CLAUSE derived. The conclusion follows -- the proof is complete."
  finished: "every tracked skill has reached the mastery threshold."
  bad_step: "a step is `<clause> <clause> = <literals>`, for example `c1 c2 = B`"
  unknown_clause: "no clause called {sentence}"
  own_topic: "your own question"
  confirm_prompt: "type `yes` to confirm these facts, `merge <a> <b> <relation>` to fix one, or `quit`."
  bad_merge: "a merge is `merge <phrase id> <phrase id> same|opposite|different`."

# ----------------------------------------------- transport errors (HLD section 8's HTTP rows)
# NOT feedback. Section 8's rule is "would this be true regardless of the student's answer?" ->
# an HTTP status; "is this itself the teaching content?" -> 200 with a code. Everything here is
# the first kind: a request that could not have come from a working client.
#
# They live in this file anyway, because the browser shows some of them to a person -- a stale
# saved session, or a paragraph that is too long -- and a sentence a person reads belongs in one
# reviewable place whether or not it is teaching content. {detail} carries the machine specifics.
api:
  SCHEMA_INVALID: "That request did not match what the server expects. This is a bug in the client, not in your answer."
  UNKNOWN_FIELD: "Your saved session carries a field this version does not know. It was saved by a different build; start a fresh exercise."
  STATE_VERSION_MISMATCH: "Your saved session is from an older version of ProofPilot. Starting a fresh one."
  TAMPERED_STATE: "That session could not have come from this system, so it was refused. If you edited it by hand, start a fresh exercise."
  UNKNOWN_CLAUSE: "There is no clause with that name on the board."
  WRONG_STAGE: "That action is not available at this stage of the exercise."
  FACTS_NOT_CONFIRMED: "Check the facts and confirm them before you start proving."
  PILOT_ID_REQUIRED: "Pilot logging is on for this session. Enter a Pilot ID and try again."
  ALREADY_FINISHED: "This exercise is already finished. Move on to the next one."
  RESET_REQUIRED: "Changing a merge discards the proof built on the old symbols. Confirm first."
  PAYLOAD_TOO_LARGE: "That request is too large. Shorten the paragraph and try again."
  BAD_DATA_FILE: "The server's own data files are invalid, so it refused to answer. This needs fixing by the team."
  INTERNAL_ERROR: "Something went wrong on the server. Nothing you did caused it, and nothing was saved."
  NOT_IMPLEMENTED: "That part of ProofPilot is not built yet."

# ------------------------------------------------- FOL outcomes (HLD section 18.6.4, Phase 8b)
# NOT consumed by any code path yet -- session.py never calls fol_prove() until the Phase 8b
# gate opens (HLD section 18.7). Written now, alongside the FolProofOutcome values it will one
# day render, so the wording exists and is reviewable before the wiring that needs it, rather
# than invented under a later gate's time pressure. {steps} is filled by the edge.
fol:
  proved: "Valid -- the empty clause was derived in {steps} step(s)."
  budget_exhausted: >
    No proof was found within the search budget. This does NOT mean the argument is invalid --
    first-order logic is only semi-decidable, so a valid argument may require more steps than the
    system's budget allows. Try simplifying your premises.
  inconsistent: >
    The premises alone are contradictory (the empty clause was derived from the premises before
    the conclusion was even used). This means the argument is trivially valid but the premises
    cannot all be true together.
  # Exam-form captions for the proof trace (HLD S18.15.6). The negated goal is called out
  # because a refutation is unreadable until you can see that the OPPOSITE of the goal was
  # assumed on purpose; without the caption that clause looks like a fourth premise.
  negated_goal: >
    Negated for refutation -- this is the opposite of what we want to prove. Deriving a
    contradiction from it is what shows the goal must be true.
  conclusion_proved: "{premises} together with {negated} is unsatisfiable, so {goal} is proved."
