[pytest]
# `backend` (not `.`) is on the path so tests import `src.core.*`, matching how the CLI is run
# (`python -m src.cli` from backend/). One import style everywhere, no sys.path hacks.
pythonpath = backend
testpaths = backend/tests

# -ra            summarise every non-passing outcome, so a skip or xfail cannot hide in silence
# --strict-markers  an unregistered marker is an error, not a typo that silently skips nothing
# xfail_strict   an xfail that unexpectedly PASSES fails the suite, so stale xfails get removed
addopts = -ra --strict-markers
xfail_strict = true
