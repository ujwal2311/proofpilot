# ProofPilot is run from source, not installed, so there is deliberately no [build-system].
# The [project] table exists for ONE reason: `requires-python` is the single source of truth for
# the supported Python version. CLAUDE.md, the README and docs/HLD.md reference it; they must not
# restate a version number of their own.
# pytest config stays in pytest.ini (pytest prefers it over this file).

[project]
name = "proofpilot"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "frontend"]

[tool.ruff.lint]
# E/F  pycodestyle + pyflakes: the baseline correctness and style set
# I    import sorting, so import order never shows up as diff noise
# B    flake8-bugbear: real bug patterns (mutable defaults, loop-variable capture) that
#      matter in a codebase built on dataclasses and closures
# C901 mccabe cyclomatic complexity. BLOCKING, and it replaced the line budgets as the gate on
#      viva explainability (sprint rule, 2026-10-12): a cap on a bucket was only ever a proxy for
#      "both members can explain every module", and five sprint stops showed it was a bad one --
#      every overrun was estimation error, not bloat. Complexity measures the thing directly.
select = ["E", "F", "I", "B", "C901"]

[tool.ruff.lint.mccabe]
# 10 is the conventional threshold. It found two functions on the day it was switched on: the
# grammar's `parse_sentence` at 18, now three phases plus a head-word dispatch table, and the
# CLI's command chain at 11, now a table. Both were genuine simplifications -- nothing was
# allowlisted to get under it.
max-complexity = 10
