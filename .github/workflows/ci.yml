name: tests

on:
  push:
  pull_request:

# 6 jobs total: 4 matrix + 1 determinism + 1 lint.
# Runner labels are PINNED, never `-latest`: a runner that changes underneath the project turns a
# passing build into an unreproducible failure. Labels confirmed against
# docs.github.com/en/actions/reference/runners/github-hosted-runners.
env:
  # pip is deliberately NOT upgraded here. Pinning exists so the toolchain does not move during
  # the build; this only silences the "a new release of pip is available" nag.
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One failing cell must not cancel the others -- a Windows-only or 3.13-only break is
      # exactly the signal this matrix exists to surface.
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt -c constraints.txt

      - name: Run tests
        run: python -m pytest

  determinism:
    # Two fixed hash seeds rather than leaving PYTHONHASHSEED unset. An unseeded run can expose a
    # set/dict-ordering bug but cannot reproduce it; two fixed seeds fail deterministically, which
    # is what docs/HLD.md section 17.10 requires.
    # From Phase 8 this job also re-runs the experiment scripts under both seeds and diffs their
    # outputs (see HLD section 16, v2.3).
    name: determinism (two hash seeds)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt -c constraints.txt

      - name: pytest with PYTHONHASHSEED=0
        env:
          PYTHONHASHSEED: "0"
        run: python -m pytest

      - name: pytest with PYTHONHASHSEED=4242
        env:
          PYTHONHASHSEED: "4242"
        run: python -m pytest

  lint:
    name: ruff
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt -c constraints.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Line budgets
        run: python scripts/loc.py
