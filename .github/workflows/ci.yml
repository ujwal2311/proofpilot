name: tests

on:
  push:
  pull_request:

# 6 jobs total: 4 matrix + 1 determinism + 1 lint.
# Runner labels are PINNED, never `-latest`: `ubuntu-latest` migrates to Ubuntu 26 on 2026-10-19
# and `windows-latest` already moved to Server 2025. A runner changing under us mid-project would
# be an unreproducible CI break during the build or viva week.
# Labels confirmed against docs.github.com/en/actions/reference/runners/github-hosted-runners.

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest

  determinism:
    # Two fixed hash seeds instead of leaving PYTHONHASHSEED unset. Unseeded runs can expose an
    # ordering bug but cannot reproduce it; these two make a set/dict-order dependency fail
    # deterministically, which is what docs/HLD.md section 17.10 requires.
    name: determinism (two hash seeds)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: pytest with PYTHONHASHSEED=0
        env:
          PYTHONHASHSEED: "0"
        run: python -m pytest

      - name: pytest with PYTHONHASHSEED=4242
        env:
          PYTHONHASHSEED: "4242"
        run: python -m pytest

  lint:
    name: ruff
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .
