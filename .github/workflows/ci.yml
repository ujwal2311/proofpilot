name: tests

on:
  push:
  pull_request:

# 7 jobs total: 4 matrix + 1 determinism + 1 lint + 1 slow sweep.
# Runner labels are PINNED, never `-latest`: a runner that changes underneath the project turns a
# passing build into an unreproducible failure. Labels confirmed against
# docs.github.com/en/actions/reference/runners/github-hosted-runners.
env:
  # pip is deliberately NOT upgraded here. Pinning exists so the toolchain does not move during
  # the build; this only silences the "a new release of pip is available" nag.
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One failing cell must not cancel the others -- a Windows-only or 3.13-only break is
      # exactly the signal this matrix exists to surface.
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt -c constraints.txt

      # The slow sweeps run on ONE matrix cell as well as in the dedicated job (sprint addendum 2),
      # so the property and differential tests execute on every push even if the dedicated job is
      # ever removed or renamed. Belt and braces, because "skipped everywhere" is how they rotted
      # in the first place.
      - name: Run tests
        env:
          PROOFPILOT_SLOW: ${{ (matrix.os == 'ubuntu-24.04' && matrix.python == '3.12') && '1' || '' }}
        run: python -m pytest

      - name: Derived data is fresh (BANK GATE B1)
        # Re-runs scripts/difficulty.py and diffs it against the committed bands. Without this,
        # one edit to an exercise or to `search` leaves a wrong band in the bank, and band
        # selection, the simulation and the results table all silently inherit it.
        run: python scripts/difficulty.py --check

  determinism:
    # Two fixed hash seeds rather than leaving PYTHONHASHSEED unset. An unseeded run can expose a
    # set/dict-ordering bug but cannot reproduce it; two fixed seeds fail deterministically, which
    # is what docs/HLD.md section 17.10 requires.
    # From Phase 8 this job also re-runs the experiment scripts under both seeds and diffs their
    # outputs (see HLD section 16, v2.3).
    name: determinism (two hash seeds)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt -c constraints.txt

      - name: pytest with PYTHONHASHSEED=0
        env:
          PYTHONHASHSEED: "0"
        run: python -m pytest

      - name: pytest with PYTHONHASHSEED=4242
        env:
          PYTHONHASHSEED: "4242"
        run: python -m pytest

  slow:
    # The opt-in sweeps -- the 400-case production-budget sweep in test_search_budget.py and
    # anything else gated on PROOFPILOT_SLOW. They are opt-in locally because they cost about a
    # minute, but "skipped by default" plus "nobody sets the variable" is a test that does not
    # exist. This job is the thing that sets it, so the count in CI is always the full count.
    name: pytest (slow sweeps)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt -c constraints.txt

      # -rs lists skip reasons. With the flag set there must be none: a test skipped in every job
      # is a test that does not exist, and a NEW opt-in test added later must not be able to go
      # unrun in CI the way this one did.
      - name: pytest with the slow sweeps enabled, and nothing skipped
        env:
          PROOFPILOT_SLOW: "1"
        run: |
          python -m pytest -rs | tee slow.log
          ! grep -q "^SKIPPED" slow.log

  lint:
    name: ruff
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt -c constraints.txt

      # `ruff check` includes C901 at max-complexity 10 (pyproject.toml). It is one of the two
      # BLOCKING explainability gates that replaced the line caps as a blocking check on
      # 2026-10-12 -- a cap on a bucket was only ever a proxy for "both members can explain every
      # module", and complexity measures that directly.
      - name: Lint (includes the C901 complexity gate)
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      # The other blocking gate: every function at most 60 code lines. This step also prints the
      # bucket table and the length-gate allowlist, so both stay visible in the log even though
      # the caps now only report. `--strict` returns when the sprint rule expires at progress-v1.
      - name: Function length gate, and the reported line budgets
        run: python tools/loc.py
