name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      # -p no:randomly is not needed; determinism is enforced in the code, not the runner.
      # PYTHONHASHSEED is varied on purpose: hash-order bugs must fail CI, not hide behind a seed.
      - name: Run tests
        run: python -m pytest
