name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    # Pinned, not `ubuntu-latest`: that label migrates to Ubuntu 26 on 2026-10-19 and a runner
    # change mid-project would be an unreproducible CI break during the build.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      # -p no:randomly is not needed; determinism is enforced in the code, not the runner.
      # PYTHONHASHSEED is varied on purpose: hash-order bugs must fail CI, not hide behind a seed.
      - name: Run tests
        run: python -m pytest
